<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 420 245"
     width="420"
     height="245"
     role="img"
     aria-label="Naveen Kumar top languages">

<defs>

<style><![CDATA[
text{
  font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(8px)
  }
  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes shineX{
  0%{
    transform:translateX(-140px)
  }
  60%,100%{
    transform:translateX(460px)
  }
}

.row{
  opacity:0;
  animation:fadeUp .5s ease forwards
}

.sh{
  animation:shineX 4s ease-in-out 2.2s infinite
}
]]></style>

<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%">
    <animate
      attributeName="stop-color"
      values="#ff4ecd;#c084fc;#ff4ecd"
      dur="6s"
      repeatCount="indefinite"/>
  </stop>

  <stop offset="100%">
    <animate
      attributeName="stop-color"
      values="#c084fc;#ff4ecd;#c084fc"
      dur="6s"
      repeatCount="indefinite"/>
  </stop>
</linearGradient>

<linearGradient id="shg"
                x1="0"
                y1="0"
                x2="1"
                y2="0">

  <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#fff" stop-opacity=".08"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>

</linearGradient>

<clipPath id="cardc">
  <rect x="1" y="1" width="418" height="243" rx="14"/>
</clipPath>

</defs>

<!-- Card -->

<rect
  x="1"
  y="1"
  width="418"
  height="243"
  rx="14"
  fill="#170e28"
  stroke="url(#tg)"
  stroke-width="1.5"/>

<!-- Title -->

<text
  x="20"
  y="31"
  font-size="15"
  font-weight="bold"
  fill="url(#tg)">
  🧰 Naveen Kumar - Tech Stack
</text>

<!-- Language distribution -->

<rect
  x="20"
  y="50"
  width="380"
  height="10"
  rx="5"
  fill="#241740"/>

<rect
  x="20"
  y="50"
  width="114"
  height="10"
  rx="5"
  fill="#ff7a59"/>

<rect
  x="134"
  y="50"
  width="76"
  height="10"
  fill="#c084fc"/>

<rect
  x="210"
  y="50"
  width="57"
  height="10"
  fill="#fde047"/>

<rect
  x="267"
  y="50"
  width="47"
  height="10"
  fill="#38bdf8"/>

<rect
  x="314"
  y="50"
  width="86"
  height="10"
  rx="5"
  fill="#7db8ff"/>


<!-- Python -->

<g class="row" style="animation-delay:.70s">

<circle
  cx="26"
  cy="82"
  r="5"
  fill="#ff7a59"/>

<text
  x="40"
  y="87"
  font-size="13"
  fill="#e6edf3"
  font-weight="bold">
  Python
</text>

<text
  x="396"
  y="87"
  text-anchor="end"
  font-size="13"
  fill="#ff7a59"
  font-weight="bold">
  90%
</text>

<rect
  x="40"
  y="94"
  width="268"
  height="8"
  rx="4"
  fill="#241740"/>

<rect
  x="40"
  y="94"
  width="241"
  height="8"
  rx="4"
  fill="#ff7a59"/>

</g>


<!-- AI / ML -->

<g class="row" style="animation-delay:.90s">

<circle
  cx="26"
  cy="122"
  r="5"
  fill="#c084fc"/>

<text
  x="40"
  y="127"
  font-size="13"
  fill="#e6edf3"
  font-weight="bold">
  AI / ML
</text>

<text
  x="396"
  y="127"
  text-anchor="end"
  font-size="13"
  fill="#c084fc"
  font-weight="bold">
  80%
</text>

<rect
  x="40"
  y="134"
  width="268"
  height="8"
  rx="4"
  fill="#241740"/>

<rect
  x="40"
  y="134"
  width="214"
  height="8"
  rx="4"
  fill="#c084fc"/>

</g>


<!-- JavaScript -->

<g class="row" style="animation-delay:1.10s">

<circle
  cx="26"
  cy="162"
  r="5"
  fill="#fde047"/>

<text
  x="40"
  y="167"
  font-size="13"
  fill="#e6edf3"
  font-weight="bold">
  JavaScript
</text>

<text
  x="396"
  y="167"
  text-anchor="end"
  font-size="13"
  fill="#fde047"
  font-weight="bold">
  65%
</text>

<rect
  x="40"
  y="174"
  width="268"
  height="8"
  rx="4"
  fill="#241740"/>

<rect
  x="40"
  y="174"
  width="174"
  height="8"
  rx="4"
  fill="#fde047"/>

</g>


<!-- Flask / Web -->

<g class="row" style="animation-delay:1.30s">

<circle
  cx="26"
  cy="202"
  r="5"
  fill="#38bdf8"/>

<text
  x="40"
  y="207"
  font-size="13"
  fill="#e6edf3"
  font-weight="bold">
  Flask / Web
</text>

<text
  x="396"
  y="207"
  text-anchor="end"
  font-size="13"
  fill="#38bdf8"
  font-weight="bold">
  75%
</text>

<rect
  x="40"
  y="214"
  width="268"
  height="8"
  rx="4"
  fill="#241740"/>

<rect
  x="40"
  y="214"
  width="201"
  height="8"
  rx="4"
  fill="#38bdf8"/>

</g>


<!-- Shine -->

<g clip-path="url(#cardc)">
  <rect
    class="sh"
    x="0"
    y="0"
    width="100"
    height="245"
    fill="url(#shg)"
    transform="skewX(-15)"/>
</g>

</svg>