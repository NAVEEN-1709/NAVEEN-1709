<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 420 282"
     width="420"
     height="282"
     role="img"
     aria-label="Naveen Kumar technology skills">

<defs>

<style>
text {
  font-family: SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes shine {
  from {
    transform: translateX(-160px) skewX(-15deg);
  }
  to {
    transform: translateX(520px) skewX(-15deg);
  }
}

.row {
  opacity: 0;
  animation: fadeUp 0.6s ease forwards;
}

.shine {
  animation: shine 4s ease-in-out 2s infinite;
}
</style>

<linearGradient id="gradient"
                x1="0"
                y1="0"
                x2="1"
                y2="0">

  <stop offset="0%" stop-color="#ff4ecd">
    <animate
      attributeName="stop-color"
      values="#ff4ecd;#8b5cf6;#ff4ecd"
      dur="6s"
      repeatCount="indefinite"/>
  </stop>

  <stop offset="100%" stop-color="#8b5cf6">
    <animate
      attributeName="stop-color"
      values="#8b5cf6;#ff4ecd;#8b5cf6"
      dur="6s"
      repeatCount="indefinite"/>
  </stop>

</linearGradient>

<linearGradient id="shineGradient"
                x1="0"
                y1="0"
                x2="1"
                y2="0">

  <stop offset="0%" stop-color="white" stop-opacity="0"/>
  <stop offset="50%" stop-color="white" stop-opacity="0.08"/>
  <stop offset="100%" stop-color="white" stop-opacity="0"/>

</linearGradient>

<clipPath id="cardClip">
  <rect
    x="1"
    y="1"
    width="418"
    height="280"
    rx="14"/>
</clipPath>

</defs>

<!-- Background -->

<rect
  x="1"
  y="1"
  width="418"
  height="280"
  rx="14"
  fill="#170e28"
  stroke="url(#gradient)"
  stroke-width="1.5"/>

<!-- Title -->

<text
  x="20"
  y="34"
  font-size="16"
  font-weight="bold"
  fill="url(#gradient)">
  Naveen Kumar - Tech Stack
</text>

<!-- Top skill overview -->

<rect
  x="20"
  y="58"
  width="380"
  height="11"
  rx="5.5"
  fill="#241740"/>

<rect
  x="20"
  y="58"
  width="125"
  height="11"
  rx="5.5"
  fill="#ff7a59"/>

<rect
  x="145"
  y="58"
  width="95"
  height="11"
  fill="#c084fc"/>

<rect
  x="240"
  y="58"
  width="65"
  height="11"
  fill="#fde047"/>

<rect
  x="305"
  y="58"
  width="45"
  height="11"
  fill="#38bdf8"/>

<rect
  x="350"
  y="58"
  width="50"
  height="11"
  rx="5.5"
  fill="#60a5fa"/>

<!-- Python -->

<g class="row" style="animation-delay:0.5s">

  <circle
    cx="26"
    cy="91"
    r="5"
    fill="#ff7a59"/>

  <text
    x="40"
    y="96"
    font-size="13"
    fill="#e6edf3"
    font-weight="bold">
    Python
  </text>

  <text
    x="396"
    y="96"
    text-anchor="end"
    font-size="13"
    fill="#ff7a59"
    font-weight="bold">
    90%
  </text>

  <rect
    x="40"
    y="104"
    width="268"
    height="9"
    rx="4.5"
    fill="#241740"/>

  <rect
    x="40"
    y="104"
    width="241.2"
    height="9"
    rx="4.5"
    fill="#ff7a59">

    <animate
      attributeName="width"
      from="0"
      to="241.2"
      dur="1.1s"
      begin="0.8s"
      fill="freeze"/>

  </rect>

</g>

<!-- AI / ML -->

<g class="row" style="animation-delay:0.8s">

  <circle
    cx="26"
    cy="133"
    r="5"
    fill="#c084fc"/>

  <text
    x="40"
    y="138"
    font-size="13"
    fill="#e6edf3"
    font-weight="bold">
    AI / ML
  </text>

  <text
    x="396"
    y="138"
    text-anchor="end"
    font-size="13"
    fill="#c084fc"
    font-weight="bold">
    80%
  </text>

  <rect
    x="40"
    y="146"
    width="268"
    height="9"
    rx="4.5"
    fill="#241740"/>

  <rect
    x="40"
    y="146"
    width="214.4"
    height="9"
    rx="4.5"
    fill="#c084fc">

    <animate
      attributeName="width"
      from="0"
      to="214.4"
      dur="1.1s"
      begin="1.1s"
      fill="freeze"/>

  </rect>

</g>

<!-- JavaScript -->

<g class="row" style="animation-delay:1.1s">

  <circle
    cx="26"
    cy="175"
    r="5"
    fill="#fde047"/>

  <text
    x="40"
    y="180"
    font-size="13"
    fill="#e6edf3"
    font-weight="bold">
    JavaScript
  </text>

  <text
    x="396"
    y="180"
    text-anchor="end"
    font-size="13"
    fill="#fde047"
    font-weight="bold">
    65%
  </text>

  <rect
    x="40"
    y="188"
    width="268"
    height="9"
    rx="4.5"
    fill="#241740"/>

  <rect
    x="40"
    y="188"
    width="174.2"
    height="9"
    rx="4.5"
    fill="#fde047">

    <animate
      attributeName="width"
      from="0"
      to="174.2"
      dur="1.1s"
      begin="1.4s"
      fill="freeze"/>

  </rect>

</g>

<!-- Flask / Web -->

<g class="row" style="animation-delay:1.4s">

  <circle
    cx="26"
    cy="217"
    r="5"
    fill="#38bdf8"/>

  <text
    x="40"
    y="222"
    font-size="13"
    fill="#e6edf3"
    font-weight="bold">
    Flask / Web
  </text>

  <text
    x="396"
    y="222"
    text-anchor="end"
    font-size="13"
    fill="#38bdf8"
    font-weight="bold">
    75%
  </text>

  <rect
    x="40"
    y="230"
    width="268"
    height="9"
    rx="4.5"
    fill="#241740"/>

  <rect
    x="40"
    y="230"
    width="201"
    height="9"
    rx="4.5"
    fill="#38bdf8">

    <animate
      attributeName="width"
      from="0"
      to="201"
      dur="1.1s"
      begin="1.7s"
      fill="freeze"/>

  </rect>

</g>

<!-- Shine -->

<g clip-path="url(#cardClip)">

  <rect
    class="shine"
    x="0"
    y="0"
    width="100"
    height="282"
    fill="url(#shineGradient)"/>

</g>

</svg>