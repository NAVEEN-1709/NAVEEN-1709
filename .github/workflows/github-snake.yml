name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate-snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: NAVEEN-1709
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff4ecd&color_dots=%230d1117,%23241a40,%238b5cf6,%23c084fc,%23ff4ecd
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ff4ecd&color_dots=%230d1117,%23241a40,%238b5cf6,%23c084fc,%23ff4ecd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}