<!-- name=assets/lanyard.svg?v=1 -->
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="720" viewBox="0 0 420 720" role="img" aria-label="lanyard card">
  <defs>
    <linearGradient id="strap" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff4ecd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="sweep">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- strap -->
  <g transform="translate(180,0)">
    <rect x="-30" y="0" width="60" height="260" rx="30" fill="url(#strap)" />
    <rect x="-26" y="6" width="52" height="248" rx="26" fill="rgba(255,255,255,0.02)"/>
    <!-- subtle swing -->
    <g transform="translate(0,0)">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" values="-4 195 130;4 195 130;-4 195 130" dur="4.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- clasp -->
  <g transform="translate(150,250)">
    <rect x="0" y="0" width="120" height="28" rx="10" fill="#d1d5db" />
    <rect x="8" y="4" width="104" height="20" rx="8" fill="#f8fafc" />
  </g>

  <!-- ring -->
  <circle cx="210" cy="296" r="14" fill="#9397a0" />

  <!-- card -->
  <g transform="translate(40,332)">
    <rect width="340" height="220" rx="14" ry="14" fill="linearGradient(#fff,#f3f2ff)" stroke="#e9e7fb"/>
    <rect x="12" y="12" width="90" height="90" rx="10" ry="10" fill="#f3f4ff" stroke="#e5e2fb"/>
    <!-- avatar ring using profile embedded -->
    <g transform="translate(18,18)">
      <circle cx="45" cy="45" r="36" fill="#fff" stroke="#e6e1ff" />
      <clipPath id="avclip">
        <circle cx="45" cy="45" r="34" />
      </clipPath>
      <image x="12" y="12" width="66" height="66" clip-path="url(#avclip)" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGNgYAAAAAMAAWgmWQ0AAAAASUVORK5CYII=" preserveAspectRatio="xMidYMid slice"/>
    </g>

    <text x="118" y="40" font-size="18" font-family="sans-serif" fill="#0b1220" font-weight="700">NAVEEN KUMAR</text>
    <text x="118" y="64" font-size="13" font-family="sans-serif" fill="#374151">Developer • @NAVEEN-1709</text>

    <!-- barcode & QR placeholder -->
    <g transform="translate(18,120)">
      <rect x="0" y="0" width="210" height="56" fill="#0b1220" rx="6" opacity="0.06"/>
      <rect x="230" y="0" width="72" height="72" fill="#e9e8ff" stroke="#d2ccff"/>
      <text x="8" y="44" font-size="10" fill="#9aa4b2">Barcode</text>
    </g>

    <!-- holographic sweep -->
    <rect x="-40" y="-20" width="80" height="300" fill="#fff" opacity="0.06" transform="rotate(-20 0 0)">
      <animate attributeName="x" values="-80;420" dur="2.6s" repeatCount="indefinite"/>
    </rect>

  </g>
</svg>