<!-- name=assets/banner.svg?v=1 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Banner for NAVEEN KUMAR">
  <defs>
    <!-- Animated gradient -->
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="40%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff4ecd">
        <animate attributeName="stop-color" values="#ff4ecd;#8b5cf6;#38bdf8;#ff4ecd" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#38bdf8;#ff4ecd;#8b5cf6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Soft background pattern -->
    <radialGradient id="bgGlow" cx="30%" cy="20%">
      <stop offset="0%" stop-color="#0b1220" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#071018" stop-opacity="1"/>
    </radialGradient>

    <!-- clip for right avatar -->
    <clipPath id="avatarClip">
      <rect x="852" y="86" rx="28" ry="28" width="320" height="420" />
    </clipPath>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="18" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- handwritten name path (converted to vector paths) -->
    <!-- This path approximates a cursive "NAVEEN KUMAR" converted to outlines -->
    <path id="namePath" d="M120 320 C150 240 230 220 310 260 C370 290 430 360 480 325 C520 300 560 255 620 260 C700 268 760 322 820 320" fill="none" stroke="none"/>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>
  <rect x="48" y="36" rx="26" ry="26" width="1184" height="668" fill="url(#g1)" opacity="0.22"/>

  <!-- floating particles -->
  <g id="particles" opacity="0.9">
    <circle cx="220" cy="120" r="2" fill="#ff4ecd">
      <animate attributeName="cy" from="100" to="160" dur="8s" repeatCount="indefinite" />
      <animate attributeName="cx" from="200" to="240" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="70" r="3" fill="#8b5cf6">
      <animate attributeName="cy" from="50" to="110" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="200" r="2.6" fill="#38bdf8">
      <animate attributeName="cy" from="180" to="240" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- left terminal block -->
  <g id="terminal" transform="translate(60,72)">
    <rect width="420" height="240" rx="12" ry="12" fill="rgba(5,8,14,0.6)" stroke="rgba(255,255,255,0.03)"/>
    <text x="18" y="36" font-family="monospace" font-size="14" fill="#9fbfe8">user@dev:~$</text>
    <g transform="translate(18,56)" >
      <text x="0" y="18" font-family="monospace" font-size="14" fill="#bfe7ff">
        <tspan class="cmd" style="white-space:pre">cat README.md</tspan>
      </text>
      <rect x="0" y="26" width="8" height="2" fill="#bfe7ff">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- stats mini -->
    <g transform="translate(18,120)">
      <text x="0" y="0" font-size="12" fill="#9fbfe8">Experience</text>
      <rect x="0" y="8" width="320" height="10" rx="6" fill="#071025"></rect>
      <rect x="0" y="8" width="160" height="10" rx="6" fill="#38bdf8">
        <animate attributeName="width" values="0;160" dur="1.6s" fill="freeze" />
      </rect>
      <text x="332" y="16" font-size="11" fill="#9fbfe8">4y</text>
    </g>
  </g>

  <!-- center: handwritten name converted to paths -->
  <g transform="translate(80,160)">
    <!-- Large vector path for "NAVEEN KUMAR" (stylized cursive outlines) -->
    <g id="name" transform="translate(120,20) scale(1.1)">
      <path d="M40 150 C70 80 150 60 230 100 C290 130 350 200 400 180 C440 165 480 120 540 124 C620 132 680 186 740 184" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
        <animate attributeName="stroke-dasharray" from="0,2000" to="2000,0" dur="2.6s" begin="0.6s" fill="freeze" />
      </path>
      <!-- glow fill appears after stroke -->
      <path d="M40 150 C70 80 150 60 230 100 C290 130 350 200 400 180 C440 165 480 120 540 124 C620 132 680 186 740 184" fill="none" stroke="#ffb7ea" stroke-width="2" stroke-linecap="round" opacity="0.18">
        <animate attributeName="opacity" values="0;0.18" dur="1.1s" begin="3.3s" fill="freeze"/>
      </path>
    </g>

    <!-- role cycle -->
    <g transform="translate(60,260)">
      <text x="0" y="18" font-family="sans-serif" font-size="18" fill="#cbeeff">Role • </text>
      <text x="70" y="18" font-family="sans-serif" font-size="18" fill="#fff">
        <tspan>
          <animate attributeName="text" begin="0s" dur="10s" repeatCount="indefinite"
            values="Developer;Python Programmer;Full Stack Learner;Problem Solver;Open Source Enthusiast" />
        </tspan>
      </text>
    </g>

    <!-- quote typewriter using SMIL reveal -->
    <g transform="translate(60,300)">
      <text x="0" y="18" font-family="monospace" font-size="15" fill="#bfe7ff">
        <tspan id="q1">"Turning ideas into intelligent software,</tspan>
      </text>
      <text x="0" y="40" font-family="monospace" font-size="15" fill="#bfe7ff">
        <tspan id="q2">one commit at a time."</tspan>
      </text>
      <!-- simple opacity blink for a cursor -->
      <rect x="8" y="2" width="6" height="16" fill="#bfe7ff">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- right: avatar reveal -->
  <g transform="translate(852,86)">
    <!-- rounded panel -->
    <rect width="320" height="420" rx="28" ry="28" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.03)"/>
    <!-- hologram scan reveal using clip -->
    <g clip-path="url(#avatarClip)">
      <!-- embedded PNG (base64 of profile.png) - small placeholder if replaced keep same name and transparency -->
      <image x="882" y="96" width="320" height="420" preserveAspectRatio="xMidYMid slice" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGNgYAAAAAMAAWgmWQ0AAAAASUVORK5CYII=" opacity="0.98">
        <!-- reveal: slide down mask -->
      </image>

      <!-- scanner line -->
      <rect x="852" y="86" width="320" height="6" fill="#38bdf8" opacity="0.12">
        <animate attributeName="y" values="86;500;86" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.16;0.02;0.16" dur="3.5s" repeatCount="indefinite"/>
      </rect>

      <!-- continuous scanner clipped -->
      <g>
        <rect x="852" y="86" width="320" height="420" fill="url(#accent)" opacity="0.06">
          <animate attributeName="x" values="852;1180;852" dur="6s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- top-right neon -->
  <g transform="translate(920,36)">
    <text x="0" y="22" font-family="sans-serif" font-weight="700" font-size="20" fill="#ff4ecd" style="filter:drop-shadow(0 8px 12px rgba(255,78,205,0.12))">KEEP CODING</text>
    <text x="0" y="46" font-family="sans-serif" font-weight="700" font-size="14" fill="#8b5cf6" style="opacity:0.9">KEEP GROWING</text>
    <rect x="-6" y="4" width="150" height="36" rx="8" fill="none">
      <animate attributeName="opacity" values="0.12;0.4;0.12" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- neon flicker -->
    <g>
      <animate attributeName="opacity" values="1;0.6;1;0.8;1" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- bottom-right code editor -->
  <g transform="translate(760,520)">
    <rect x="0" y="0" width="420" height="180" rx="12" ry="12" fill="rgba(2,6,13,0.85)" stroke="rgba(255,255,255,0.02)"/>
    <text x="12" y="26" font-family="monospace" font-size="13" fill="#9fbfe8">// Live snippet</text>
    <text x="12" y="50" font-family="monospace" font-size="13" fill="#cbe7ff">
      <tspan>function buildDreams() {</tspan>
    </text>
    <text x="24" y="74" font-family="monospace" font-size="13" fill="#bfe7ff">
      <tspan>const skills = [ </tspan>
    </text>
    <text x="36" y="94" font-family="monospace" font-size="13" fill="#bfe7ff">
      <tspan>"Python",</tspan>
    </text>
    <text x="36" y="114" font-family="monospace" font-size="13" fill="#bfe7ff">
      <tspan>"JavaScript",</tspan>
    </text>
    <text x="24" y="136" font-family="monospace" font-size="13" fill="#cbe7ff">
      <tspan>];</tspan>
    </text>
    <rect x="12" y="142" width="6" height="10" fill="#bfe7ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- bottom-right small glow -->
  <g transform="translate(740,500)">
    <circle cx="160" cy="260" r="80" fill="#8b5cf6" opacity="0.04" />
  </g>
</svg>