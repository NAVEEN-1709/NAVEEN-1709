<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 660" width="420" height="660" role="img" aria-label="Naveen Kumar developer ID card lanyard">
<title>Naveen Kumar — swinging developer ID badge</title>
<defs>
<style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes settle{0%{transform:rotate(0deg) translateY(-660px)}18%{transform:rotate(0deg) translateY(0)}30%{transform:rotate(13deg)}46%{transform:rotate(-9deg)}62%{transform:rotate(6deg)}78%{transform:rotate(-3.5deg)}92%{transform:rotate(1.5deg)}100%{transform:rotate(0deg)}}
@keyframes sway{0%,100%{transform:rotate(-3.2deg)}50%{transform:rotate(3.2deg)}}
@keyframes cardWobble{0%,100%{transform:rotate(1.6deg)}50%{transform:rotate(-1.6deg)}}
@keyframes shine{0%{transform:translateX(-340px) skewX(-18deg)}55%,100%{transform:translateX(420px) skewX(-18deg)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes heartBeat{0%,100%{transform:scale(1)}12%{transform:scale(1.25)}24%{transform:scale(1)}36%{transform:scale(1.15)}48%{transform:scale(1)}}
.settle{transform-origin:210px 6px;animation:settle 3.4s cubic-bezier(.34,1.1,.5,1) forwards}
.sway{transform-origin:210px 6px;animation:sway 4.2s ease-in-out 3.4s infinite}
.wob{transform-origin:210px 300px;animation:cardWobble 4.2s ease-in-out 3.4s infinite}
.shine{animation:shine 4.5s ease-in-out 3.6s infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
.hb{transform-box:fill-box;transform-origin:center;animation:heartBeat 2.4s ease-in-out infinite}
]]></style>

<linearGradient id="strapg" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#d6478f"/><stop offset="50%" stop-color="#ff4fb3"/><stop offset="100%" stop-color="#d6478f"/>
</linearGradient>
<linearGradient id="cardg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#1d1330"/><stop offset="100%" stop-color="#0d0a18"/>
</linearGradient>
<linearGradient id="cardborder" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%"><animate attributeName="stop-color" values="#ff4fb3;#c084fc;#8b5cf6;#ff4fb3" dur="6s" repeatCount="indefinite"/></stop>
<stop offset="100%"><animate attributeName="stop-color" values="#8b5cf6;#ff4fb3;#c084fc;#8b5cf6" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#c8ccd6"/><stop offset="45%" stop-color="#8a90a0"/><stop offset="55%" stop-color="#6a7080"/><stop offset="100%" stop-color="#9aa0b0"/>
</linearGradient>
<linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".13"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="nameg" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#ff72c6"/><stop offset="50%" stop-color="#d084ff"/><stop offset="100%" stop-color="#ff72c6"/>
</linearGradient>
<radialGradient id="lglow">
<stop offset="0%" stop-color="#c084fc" stop-opacity=".18"/><stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
</radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
<clipPath id="cardclip"><rect x="62" y="288" width="296" height="340" rx="22"/></clipPath>
<clipPath id="avatarclip"><circle cx="210" cy="412" r="58"/></clipPath>
</defs>

<circle cx="210" cy="440" r="230" fill="url(#lglow)">
<animate attributeName="r" values="230;250;230" dur="5s" repeatCount="indefinite"/>
</circle>

<g class="tw" style="animation-delay:.5s"><path d="M60 200l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#f0abfc"/></g>
<g class="tw" style="animation-delay:1.6s"><path d="M372 300l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" fill="#ff7eb6"/></g>
<g class="tw" style="animation-delay:2.7s"><path d="M52 480l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" fill="#c084fc"/></g>
<g class="hb" style="animation-delay:1s"><path d="M368 480c-4-9-17-7-17 3 0 7 10 13 17 18 7-5 17-11 17-18 0-10-13-12-17-3z" fill="#ff4fb3" opacity=".8" filter="url(#glow)"/></g>

<g class="settle"><g class="sway">

<!-- Lanyard -->
<path d="M191 -6L229 -6L226 236L194 236Z" fill="url(#strapg)"/>
<line x1="196" y1="0" x2="198.5" y2="234" stroke="#fff" stroke-opacity=".55" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="224" y1="0" x2="221.5" y2="234" stroke="#fff" stroke-opacity=".55" stroke-width="1" stroke-dasharray="4 3"/>
<text x="214" y="18" font-size="10" font-weight="bold" fill="#fff" opacity=".92" letter-spacing="1.7" transform="rotate(90 214 18)">NAVEEN.DEV ♥ CODE ♥ NAVEEN.DEV</text>

<!-- Clasp -->
<rect x="188" y="232" width="44" height="26" rx="6" fill="url(#metal)" stroke="#4a4f5c"/>
<rect x="199" y="238" width="22" height="7" rx="3.5" fill="#3c414e"/>
<circle cx="210" cy="272" r="14" fill="none" stroke="url(#metal)" stroke-width="5.5"/>

<g class="wob">
<rect x="62" y="288" width="296" height="340" rx="22" fill="url(#cardg)" stroke="url(#cardborder)" stroke-width="2" filter="url(#shadow)"/>
<rect x="180" y="300" width="60" height="10" rx="5" fill="#0a0714" stroke="#3b2a5c"/>

<g clip-path="url(#cardclip)">
<rect x="62" y="288" width="296" height="38" fill="#231541" opacity=".75"/>
<text x="80" y="342" font-size="9" fill="#8b949e" letter-spacing="1.5">DEVELOPER ID</text>
<text x="340" y="342" text-anchor="end" font-size="9" fill="#ff72c6" letter-spacing="1.5">NAVEEN-1709</text>

<!-- Avatar -->
<circle cx="210" cy="412" r="62" fill="#0b0812" stroke="url(#cardborder)" stroke-width="2.5"/>
<circle cx="210" cy="412" r="58" fill="#0b0812" opacity=".55"/>
<image x="152" y="354" width="116" height="116" preserveAspectRatio="xMidYMid meet" href="profile.png" clip-path="url(#avatarclip)"/>

<!-- Name -->
<text x="210" y="515" text-anchor="middle" font-size="27" font-weight="900" fill="url(#nameg)" filter="url(#glow)" letter-spacing=".4">NAVEEN KUMAR ♥</text>
<text x="210" y="538" text-anchor="middle" font-size="11" fill="#e879f9" font-weight="bold" letter-spacing="2.5">PYTHON DEVELOPER</text>
<text x="210" y="556" text-anchor="middle" font-size="10" fill="#8b949e">@NAVEEN-1709</text>

<line x1="82" y1="570" x2="338" y2="570" stroke="#2a1f3d"/>

<!-- Barcode -->
<g transform="translate(82,582)" fill="#e6edf3" opacity=".85">
<rect x="0" y="0" width="2.5" height="25"/><rect x="5" y="0" width="1.5" height="25"/>
<rect x="9" y="0" width="3.5" height="25"/><rect x="15" y="0" width="1.5" height="25"/>
<rect x="20" y="0" width="4" height="25"/><rect x="27" y="0" width="1.5" height="25"/>
<rect x="32" y="0" width="2.5" height="25"/><rect x="37" y="0" width="4" height="25"/>
<rect x="44" y="0" width="1.5" height="25"/><rect x="48" y="0" width="2.5" height="25"/>
<rect x="54" y="0" width="4" height="25"/><rect x="61" y="0" width="1.5" height="25"/>
<rect x="65" y="0" width="3" height="25"/><rect x="71" y="0" width="1.5" height="25"/>
<rect x="76" y="0" width="4" height="25"/><rect x="83" y="0" width="1.5" height="25"/>
<rect x="88" y="0" width="2.5" height="25"/><rect x="94" y="0" width="4" height="25"/>
<rect x="101" y="0" width="1.5" height="25"/><rect x="106" y="0" width="3" height="25"/>
</g>

<text x="338" y="594" text-anchor="end" font-size="8.5" fill="#8b949e">PYTHON • AI</text>
<text x="338" y="607" text-anchor="end" font-size="8.5" fill="#8b949e">FLASK • SQL</text>

<rect class="shine" x="62" y="278" width="120" height="370" fill="url(#shineg)"/>
</g>
</g>
</g></g>

<text x="210" y="650" text-anchor="middle" font-size="10" fill="#8b949e">— NAVEEN-1709 • AURA AI • CODE ♥ BUILD • —</text>
</svg>